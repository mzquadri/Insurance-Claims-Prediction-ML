[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The notebooks are the record of where this repository started and are not
# reformatted. Their cells import where they are used and run top to bottom,
# which is ordinary in a notebook and is not worth rewriting them over.
"notebooks/*.ipynb" = [
    "E402", "E501", "E741", "W291", "W293",
    "I001", "F401", "F541", "C408", "B905", "RUF005",
]
# Puts the repository root on sys.path before importing from it, which has to
# happen after the standard library imports.
"scripts/smoke_test.py" = ["E402"]
# Puts the repository root on sys.path before importing from it.
"scripts/figures/generate_figures.py" = ["E402"]
