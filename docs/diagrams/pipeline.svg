<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="940" height="330" fill="#ffffff"/>
  <text x="470" y="30" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">From raw policy data to a calibrated, explainable claim-probability model</text>

  <!-- Stage 1 -->
  <rect x="25" y="80" width="150" height="104" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="100" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Kaggle dataset</text>
  <text x="100" y="122" text-anchor="middle" font-size="11.5" fill="#9a3412">Prediction of</text>
  <text x="100" y="137" text-anchor="middle" font-size="11.5" fill="#9a3412">Insurance Claim</text>
  <text x="100" y="156" text-anchor="middle" font-size="11" fill="#64748b">target: is_claim</text>
  <text x="100" y="172" text-anchor="middle" font-size="11" fill="#64748b">Kaggle CLI download</text>

  <!-- Stage 2 -->
  <rect x="205" y="80" width="150" height="104" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="280" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">Data pipeline</text>
  <text x="280" y="122" text-anchor="middle" font-size="11.5" fill="#166534">cleaning + feature</text>
  <text x="280" y="137" text-anchor="middle" font-size="11.5" fill="#166534">engineering</text>
  <text x="280" y="156" text-anchor="middle" font-size="11" fill="#64748b">encoders and scalers</text>
  <text x="280" y="172" text-anchor="middle" font-size="11" fill="#64748b">fit on train split only</text>

  <!-- Stage 3 -->
  <rect x="385" y="80" width="150" height="104" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="460" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#1d4ed8">Model training</text>
  <text x="460" y="122" text-anchor="middle" font-size="11.5" fill="#1e40af">LogReg · RandomForest</text>
  <text x="460" y="137" text-anchor="middle" font-size="11.5" fill="#1e40af">XGBoost · LightGBM</text>
  <text x="460" y="156" text-anchor="middle" font-size="11" fill="#64748b">StratifiedKFold CV</text>
  <text x="460" y="172" text-anchor="middle" font-size="11" fill="#64748b">AUC · Brier · log-loss</text>

  <!-- Stage 4 -->
  <rect x="565" y="80" width="150" height="104" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="640" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#6d28d9">Calibration</text>
  <text x="640" y="122" text-anchor="middle" font-size="11.5" fill="#5b21b6">Platt scaling or</text>
  <text x="640" y="137" text-anchor="middle" font-size="11.5" fill="#5b21b6">isotonic regression</text>
  <text x="640" y="156" text-anchor="middle" font-size="11" fill="#64748b">CalibratedClassifierCV</text>
  <text x="640" y="172" text-anchor="middle" font-size="11" fill="#64748b">reliability curves</text>

  <!-- Stage 5 -->
  <rect x="745" y="80" width="170" height="104" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="830" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#be185d">Decisions</text>
  <text x="830" y="122" text-anchor="middle" font-size="11.5" fill="#9d174d">cost-sensitive threshold</text>
  <text x="830" y="137" text-anchor="middle" font-size="11.5" fill="#9d174d">(illustrative cost matrix)</text>
  <text x="830" y="156" text-anchor="middle" font-size="11" fill="#64748b">+ SHAP feature</text>
  <text x="830" y="172" text-anchor="middle" font-size="11" fill="#64748b">attribution</text>

  <!-- Arrows -->
  <line x1="175" y1="132" x2="197" y2="132" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="355" y1="132" x2="377" y2="132" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="535" y1="132" x2="557" y2="132" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="715" y1="132" x2="737" y2="132" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Why it matters strip -->
  <rect x="25" y="215" width="890" height="52" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="470" y="236" text-anchor="middle" font-size="12.5" fill="#334155">A claim model is only useful if its probabilities mean something: calibration aligns scores with real frequencies,</text>
  <text x="470" y="254" text-anchor="middle" font-size="12.5" fill="#334155">the threshold translates probability into a decision, and SHAP explains what drives each score.</text>

  <!-- Chips -->
  <rect x="160" y="284" width="290" height="32" rx="16" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="305" y="305" text-anchor="middle" font-size="11.5" fill="#475569">data/ and results/ intentionally gitignored</text>
  <rect x="470" y="284" width="310" height="32" rx="16" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="625" y="305" text-anchor="middle" font-size="11.5" fill="#475569">research artifact — not an underwriting system</text>
</svg>
